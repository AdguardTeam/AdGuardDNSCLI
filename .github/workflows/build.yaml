'env':
  'BASE_IMAGE': |-
    ${{ vars.BASE_IMAGE || 'adguard/go-builder:1.26.8--1' }}
  'DIST_DIR': |-
    dist
'jobs':
  'BuildBinaries':
    'if': |
      ${{ github.repository_owner == 'AdGuardSoftwareLimited' }}
    'permissions':
      'contents': 'read'
      'id-token': 'write'
    'runs-on': 'team-go'
    'steps':
      - 'uses': 'actions/checkout@v6'
        'with':
          # Set to false to avoid GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'name': 'Set source date epoch'
        'run': |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - 'name': 'Retrieve GPG signing secrets'
        'uses': 'hashicorp/vault-action@v4'
        'with':
          'url': ${{ vars.VAULT_URL }}
          'method': 'jwt'
          'role': 'gpg-signing'
          'secrets': |
            secret/data/ci-secrets/gpg-signing gpgPassword | GPG_PASSWORD ;
            secret/data/ci-secrets/gpg-signing gpgSecretKey | GPG_SECRET_KEY ;
      - 'name': 'Build Unix'
        'uses': 'AdGuardSoftwareLimited/actions/actions/docker-build@master'
        'with':
          'dockerfile': 'docker/ci.Dockerfile'
          'context': '.'
          'target': 'builder-exporter'
          'output': '.'
          'build-args': |
            APP_VERSION=${{ github.ref_name }}
            ARCH=amd64 arm64
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BRANCH=${{ github.ref_name }}
            CACHE_BUSTER=${{ inputs.cache_buster || '0' }}
            CHANNEL="development"
            DIST_DIR=${{ env.DIST_DIR }}
            OS=darwin linux
            REVISION=${{ github.sha }}
            SIGN=1
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          'secrets': |
            GPG_KEY_PASSPHRASE=${{ env.GPG_PASSWORD }}
            GPG_SECRET_KEY=${{ env.GPG_SECRET_KEY }}
      - 'name': 'Build Windows'
        'uses': 'AdGuardSoftwareLimited/actions/actions/docker-build@master'
        'with':
          'dockerfile': 'docker/ci.Dockerfile'
          'context': '.'
          'target': 'builder-exporter'
          'output': '.'
          'build-args': |
            APP_VERSION=${{ github.ref_name }}
            ARCH=amd64
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BRANCH=${{ github.ref_name }}
            CACHE_BUSTER=${{ inputs.cache_buster || '0' }}
            CHANNEL="development"
            DIST_DIR=${{ env.DIST_DIR }}
            OS=windows
            REVISION=${{ github.sha }}
            SIGN=0
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
      - 'uses': 'actions/upload-artifact@v7'
        'with':
          'name': 'adguarddnscli-qa-windows-build'
          'path': |
            ${{ env.DIST_DIR }}/*/AdGuardDNSCLI/*.exe
  'SignWindowsEXE':
    'name': 'Sign Windows executables'
    'needs': 'BuildBinaries'
    'if': |
      ${{ github.repository_owner == 'AdGuardSoftwareLimited' }}
    'permissions':
      'contents': 'read'
      'id-token': 'write'
    'uses': 'AdGuardSoftwareLimited/actions/.github/workflows/sign-by-signer.yml@master'
    'with':
      'team': 'go'
      'artifact-name': 'adguarddnscli-qa-windows-build'
      'files': '**/**/*.exe'
      'signed-artifact-name': 'adguarddnscli-qa-windows-build'
  'BuildWindowsMSI':
    'name': 'Build Windows MSI'
    'needs': 'SignWindowsEXE'
    'if': |
      ${{ github.repository_owner == 'AdGuardSoftwareLimited' }}
    'permissions':
      'contents': 'read'
    'runs-on': 'team-go'
    'steps':
      - 'uses': 'actions/checkout@v6'
        'with':
          # Set to false to avoid GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'uses': 'actions/download-artifact@v8'
        'with':
          'name': 'adguarddnscli-qa-windows-build'
          'path': |
            ${{ env.DIST_DIR }}
      - 'name': 'Build MSI'
        'uses': 'AdGuardSoftwareLimited/actions/actions/docker-build@master'
        'with':
          'dockerfile': 'docker/ci.Dockerfile'
          'context': '.'
          'target': 'msi-builder-exporter'
          'output': '.'
          'build-args': |
            APP_VERSION=${{ github.ref_name }}
            ARCH=amd64
            CACHE_BUSTER=${{ inputs.cache_buster || '0' }}
            DIST_DIR=${{ env.DIST_DIR }}
            MSI=1
            SIGN=0
      - 'uses': 'actions/upload-artifact@v7'
        'with':
          'name': 'adguarddnscli-qa-msi'
          'path': |
            ${{ env.DIST_DIR }}/*.msi
  'SignWindowsMSI':
    'name': 'Sign Windows MSI'
    'needs': 'BuildWindowsMSI'
    'if': |
      ${{ github.repository_owner == 'AdGuardSoftwareLimited' }}
    'permissions':
      'contents': 'read'
      'id-token': 'write'
    'uses': 'AdGuardSoftwareLimited/actions/.github/workflows/sign-by-signer.yml@master'
    'with':
      'team': 'go'
      'artifact-name': 'adguarddnscli-qa-msi'
      'files': '*.msi'
      'signed-artifact-name': 'adguarddnscli-qa-msi'
  'PackArtifacts':
    'name': 'Pack artifacts'
    'needs': 'SignWindowsMSI'
    'if': |
      ${{ github.repository_owner == 'AdGuardSoftwareLimited' }}
    'permissions':
      'contents': 'read'
    'runs-on': 'team-go'
    'steps':
      - 'uses': 'actions/checkout@v6'
        'with':
          # Set to false to avoid GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'uses': 'actions/download-artifact@v8'
        'with':
          'name': 'adguarddnscli-qa-msi'
          'path': |
            ${{ env.DIST_DIR }}
      - 'name': 'Pack'
        'uses': 'AdGuardSoftwareLimited/actions/actions/docker-build@master'
        'with':
          'dockerfile': 'docker/ci.Dockerfile'
          'context': '.'
          'target': 'packer-exporter'
          'output': '.'
          'build-args': |
            APP_VERSION=${{ github.ref_name }}
            CACHE_BUSTER=${{ inputs.cache_buster || '0' }}
            DIST_DIR=${{ env.DIST_DIR }}
            SIGN=0
      - 'uses': 'actions/upload-artifact@v7'
        'with':
          'name': 'adguarddnscli-qa'
          'path': |
            ${{ env.DIST_DIR }}/*.*
'name': 'Build QA Artifacts'
'on':
  'pull_request':
    'branches':
      - '*'
  'workflow_dispatch':
    'inputs':
      'cache_buster':
        'default': ''
        'description': |
          Override to force re-run of cached stages (pass any unique value).
        'type': 'string'
# Permissions are disabled for all the jobs by default, and then overridden for
# specific jobs if needed.  This is a recommended practice for security reasons,
# and also allows to avoid mistakes with permissions when creating new jobs.
#
# See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions.
'permissions': {}
